# Tall Layout (https://sw.kovidgoyal.net/kitty/layouts/)
enabled_layouts tall:bias=50;full_size=1;mirrored=false

# Launch using CWD (https://sw.kovidgoyal.net/kitty/launch/)
map cmd+enter launch --cwd=current
map cmd+n launch --cwd=current --type=os-window
map cmd+t launch --cwd=current --type=tab
